[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berhot-foundation"
version = "0.1.0"
description = "BERHOT monorepo shared Python foundation and local data factory MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "services", "services.*"]
exclude = ["services.*.tests*", "tests*"]
